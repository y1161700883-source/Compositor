name: Build Compositor Simplified Chinese

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Chinese macOS app
    runs-on: macos-26
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode 26.6
        run: |
          sudo xcode-select -s /Applications/Xcode_26.6.app/Contents/Developer
          xcodebuild -version
          sw_vers

      - name: Write Chinese localization patch
        shell: bash
        run: |
          mkdir -p .zhbuild/zh-Hans.lproj
          printf '%s' '' | base64 --decode > .zhbuild/zh-Hans.lproj/Localizable.strings
          printf '%s' '' | base64 --decode > .zhbuild/ChineseDisplay.swift
          printf '%s' '' | base64 --decode > .zhbuild/apply_full_chinese.py
          chmod +x .zhbuild/apply_full_chinese.py

      - name: Apply Chinese patch
        run: |
          python3 .zhbuild/apply_full_chinese.py "$GITHUB_WORKSPACE"
          test -f Compositor/ChineseDisplay.swift
          test -f Compositor/zh-Hans.lproj/Localizable.strings

      - name: Resolve Swift packages
        run: |
          xcodebuild             -project Compositor.xcodeproj             -scheme Compositor             -resolvePackageDependencies

      - name: Build universal Release app
        run: |
          set -o pipefail
          xcodebuild             -project Compositor.xcodeproj             -scheme Compositor             -configuration Release             -derivedDataPath "$RUNNER_TEMP/DerivedData"             ARCHS="arm64 x86_64"             ONLY_ACTIVE_ARCH=NO             CODE_SIGNING_ALLOWED=NO             CODE_SIGNING_REQUIRED=NO             build | tee "$RUNNER_TEMP/xcodebuild.log"

      - name: Package and ad-hoc sign
        shell: bash
        run: |
          set -e
          BUILT="$RUNNER_TEMP/DerivedData/Build/Products/Release/Compositor.app"
          OUT="$RUNNER_TEMP/Compositor 完整中文版.app"
          ZIP="$RUNNER_TEMP/Compositor-完整中文版.zip"

          test -d "$BUILT"
          ditto "$BUILT" "$OUT"

          # Ensure the language is advertised by the final app bundle.
          if ! /usr/libexec/PlistBuddy -c 'Print :CFBundleLocalizations' "$OUT/Contents/Info.plist" >/dev/null 2>&1; then
            /usr/libexec/PlistBuddy -c 'Add :CFBundleLocalizations array' "$OUT/Contents/Info.plist"
          fi
          if ! /usr/libexec/PlistBuddy -c 'Print :CFBundleLocalizations' "$OUT/Contents/Info.plist" 2>/dev/null | grep -q 'zh-Hans'; then
            /usr/libexec/PlistBuddy -c 'Add :CFBundleLocalizations:0 string zh-Hans' "$OUT/Contents/Info.plist" || true
          fi

          # Re-sign the complete bundle locally, including Sparkle/XPC helpers.
          codesign --force --deep --sign - --preserve-metadata=identifier,entitlements "$OUT" ||             codesign --force --deep --sign - "$OUT"

          xattr -cr "$OUT" || true
          codesign --verify --deep --strict "$OUT"

          echo "Architectures:"
          file "$OUT/Contents/MacOS/Compositor"
          echo "Chinese resources:"
          find "$OUT/Contents/Resources" -maxdepth 2 -path '*zh-Hans.lproj*' -print

          rm -f "$ZIP"
          ditto -c -k --sequesterRsrc --keepParent "$OUT" "$ZIP"

      - name: Upload finished app
        uses: actions/upload-artifact@v4
        with:
          name: Compositor-完整中文版
          path: ${{ runner.temp }}/Compositor-完整中文版.zip
          if-no-files-found: error
          retention-days: 30

      - name: Build summary
        run: |
          cat >> "$GITHUB_STEP_SUMMARY" <<'EOF'
          ## Compositor 完整中文版构建完成
          在本次运行页面底部 **Artifacts** 区域下载 **Compositor-完整中文版**。

          下载 GitHub 的 artifact ZIP 后，里面还有一个 `Compositor-完整中文版.zip`，
          再解压一次即可得到 `Compositor 完整中文版.app`。

          这是本地 ad-hoc 签名版本，不含 Apple Developer ID 公证。
          EOF
